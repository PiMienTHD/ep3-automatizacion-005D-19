---
- name: Aprovisionamiento CSR1kv
  hosts: routers
  gather_facts: false
  vars_files:
    - ../vars/vars_005D-19.yaml
  tasks:
    - name: Respaldar configuracion actual
      ios_command:
        commands: show running-config
      register: config_backup
    - name: Guardar respaldo en archivo
      copy:
        content: "{{ config_backup.stdout[0] }}"
        dest: "respaldo/backup_{{ alumno.codigo }}.cfg"
    - name: Habilitar NETCONF
      ios_config:
        lines:
          - netconf-yang
    - name: Habilitar RESTCONF
      ios_config:
        lines:
          - restconf
    - name: Habilitar HTTP Secure Server
      ios_config:
        lines:
          - ip http secure-server
    - name: Configurar hostname
      ios_config:
        lines:
          - hostname {{ cliente.hostname }}
    - name: Configurar banner de acceso
      ios_config:
        lines:
          - banner motd ^{{ router.banner }}^
    - name: Configurar servidor NTP
      ios_config:
        lines:
          - ntp server {{ router.ntp_server }}
    - name: Configurar descripcion WAN en GigabitEthernet1
      ios_config:
        lines:
          - description {{ router.descripcion_wan }}
        parents: interface GigabitEthernet1
    - name: Crear interfaz Loopback y asignar IP
      ios_config:
        lines:
          - ip address {{ router.loopback_ip }} {{ router.loopback_mask }}
        parents: interface Loopback{{ router.loopback_id }}
